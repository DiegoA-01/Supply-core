# Integración continua (spec agents/specs/000-ci-github-actions).
# Corre en cada PR hacia develop y main, y en cada push a esas ramas. No usa secretos reales:
# las claves de prueba (MySQL y JWT) se generan dentro del job y se enmascaran en el registro.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DB_USER: root
      IA_PROVEEDOR: ninguno
      # La misma zona horaria que Docker (docker-compose.yml) y la conexión (serverTimezone=America/Bogota). En UTC,
      # entre las 19:00 y las 24:00 UTC las fechas guardadas por MySQL se leían en el día siguiente y fallaban las
      # pruebas que filtran por periodo (rotación, reabastecimiento, facturas).
      TZ: America/Bogota
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generar claves de prueba
        run: |
          DB_PASSWORD="$(openssl rand -hex 24)"
          JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"

      # MySQL se levanta en un paso (no como servicio) para usar la clave generada en el job.
      - name: Levantar MySQL 8.4 para las pruebas de fuga entre empresas
        run: |
          docker run -d --name mysql-pruebas -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" \
            -e MYSQL_DATABASE=supply_core_test \
            -e TZ=America/Bogota \
            mysql:8.4
          for i in $(seq 1 60); do
            if docker exec mysql-pruebas mysqladmin ping -h 127.0.0.1 -uroot -p"$DB_PASSWORD" --silent 2>/dev/null; then
              echo "MySQL listo"; exit 0
            fi
            sleep 2
          done
          echo "MySQL no arrancó"; docker logs mysql-pruebas; exit 1

      - name: Pruebas y cobertura (./mvnw verify)
        run: sh mvnw -B -ntp verify

      - name: Javadoc sin advertencias (doclint=all)
        run: |
          sh mvnw -B -ntp -q org.apache.maven.plugins:maven-javadoc-plugin:3.11.2:javadoc \
            -Ddoclint=all -Dshow=private 2>&1 | tee javadoc.log
          if grep -qE ": (warning|error):|^\[(WARNING|ERROR)\]" javadoc.log; then
            echo "Javadoc con advertencias"; exit 1
          fi

      - name: Reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pruebas-backend
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test -- --watch=false
      - name: Build de producción
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Construir imagen api
        run: docker build -t supply-core-api:ci ./backend
      - name: Construir imagen web
        run: docker build -t supply-core-web:ci ./frontend

      - name: Escanear api con Trivy (falla con CRÍTICAS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: supply-core-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Escanear web con Trivy (falla con CRÍTICAS)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: supply-core-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Spec 010: el recorrido del mostrador de punta a punta contra el stack de Docker (abrir turno → vender → anular con
  # PIN → cerrar). El .env y las cuentas se generan dentro del job con claves aleatorias y nunca se suben.
  e2e:
    name: e2e
    # Solo si las pruebas del backend y del frontend pasaron; un envío nuevo a la misma rama cancela el anterior
    needs: [backend, frontend]
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: .env de prueba con claves aleatorias (enmascaradas)
        run: |
          python3 scripts/env_de_prueba.py
          # Solo se enmascaran los secretos: usuario, puerto y URL quedan legibles en los registros
          grep -E '^(MYSQL_ROOT_PASSWORD|DB_PASSWORD|JWT_SECRET|PLATAFORMA_ADMIN_PASSWORD)=' .env | cut -d= -f2- \
            | while read -r v; do [ -n "$v" ] && echo "::add-mask::$v"; done

      - name: Levantar el stack de Docker
        run: docker compose up -d --build

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8088/api/auth/login || true)
            if [ "$c" = "400" ] || [ "$c" = "401" ]; then echo "API lista ($c)"; exit 0; fi
            sleep 5
          done
          docker compose logs --tail=200 api
          exit 1

      - name: Sembrar la demo (cuentas en un archivo local del job)
        run: python3 scripts/sembrar_demo.py

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Prueba de punta a punta (Playwright)
        working-directory: e2e
        run: npx playwright test

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Registros del stack si algo falla
        if: failure()
        run: docker compose logs --tail=300

      - name: Apagar el stack
        if: always()
        run: docker compose down -v
