# Revisa las dependencias que agrega o cambia cada PR y lo bloquea si traen vulnerabilidades altas o críticas.
name: Dependency Review

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
