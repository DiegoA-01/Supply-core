# Análisis de seguridad del código con CodeQL: cada semana y en cada PR hacia main.
name: CodeQL

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analizar:
    name: CodeQL (${{ matrix.lenguaje }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.lenguaje }}
