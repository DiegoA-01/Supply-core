# Avisos automáticos de dependencias con vulnerabilidades conocidas (Maven y acciones de GitHub).
# Cada semana abre un Pull Request por cada actualización; las de seguridad llegan además por separado.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
