# nginx de Supply-Core: sirve el frontend Angular y reenvía /api al backend (servicio "api" de docker-compose).
# Corre sin root, por eso escucha en el 8080.

# DNS interno de Docker: se vuelve a resolver "api" cada pocos segundos, así que si el backend se recrea
# (cambia de IP) nginx lo sigue sin reiniciarse.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime lo que es texto (el JS de Angular baja a la cuarta parte).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Un poco más que el límite de la aplicación (10 MB por archivo): el backend es quien rechaza con un mensaje claro.
    client_max_body_size 11m;

    # Para saber si nginx está vivo sin tocar el backend.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API: todo lo que empieza por /api/ va al backend ----
    location ^~ /api/ {
        set $backend http://api:8080;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se SOBRESCRIBE (no se agrega a lo que mande el cliente): así nadie puede falsificar su IP para esquivar
        # el límite de peticiones. El backend solo confía en este encabezado cuando quien conecta es este proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # La lectura de cotizaciones con IA puede tardar minutos (Gemini 180 s, Ollama hasta 600 s).
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 660s;
        proxy_request_buffering on;

        # Las respuestas de la API nunca se guardan en cachés compartidas.
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguridad.conf;

        error_page 502 503 504 = @api_caido;
    }

    # Mismo formato de error que devuelve el backend, para que la pantalla muestre un mensaje y no una página en blanco.
    location @api_caido {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/seguridad.conf;
        return 503 '{"codigo":"SERVICIO_NO_DISPONIBLE","mensaje":"El servidor no está disponible. Intenta de nuevo en unos minutos."}';
    }

    # El contrato de la API y los endpoints de gestión no se publican hacia afuera.
    location ~ ^/(swagger-ui|v3/api-docs|actuator) {
        return 404;
    }

    # Archivos con huella en el nombre (main-AB12CD.js): cambian de nombre si cambian, se guardan un año.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguridad.conf;
    }

    # La aplicación de una sola página: cualquier ruta del navegador (/app/solicitudes...) devuelve index.html.
    # index.html nunca se guarda: así un despliegue nuevo se ve al recargar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/seguridad.conf;
    }

    # Nada de archivos ocultos.
    location ~ /\. {
        return 404;
    }
}
