spring:
  application:
    name: supply-core
  datasource:
    url: jdbc:mysql://localhost:3306/supply_core?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # el esquema lo maneja Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
