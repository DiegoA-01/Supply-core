# Perfil de las pruebas de integración contra MySQL real (aislamiento entre empresas).
# Usa una base SEPARADA (supply_core_test): Flyway la borra y la recrea en cada ejecución.
# La clave de MySQL sale de application-local.yaml o de DB_PASSWORD, igual que en desarrollo.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/supply_core_test?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&useUnicode=true&characterEncoding=utf8
  flyway:
    clean-disabled: false

app:
  admin:
    password: ""                 # no se crea el administrador inicial
  rfq:
    cierre-automatico: false     # sin jobs en segundo plano durante las pruebas
  aprobacion:
    sla-automatico: false
  ventas:
    cuadre-cron: "-"            # el cuadre diario se prueba llamándolo, no a la 01:00
  plataforma:
    cache-segundos: 0           # cada petición lee la suscripción de la base, sin memoria
  sesion:
    cache-segundos: 0           # cada petición revisa en la base si el usuario sigue activo
    limite-por-minuto: 500      # las pruebas inician muchas sesiones seguidas desde la misma IP
    mfa-admin-obligatorio: false  # las pruebas de siempre inician sesión sin segundo factor; las de MFA lo activan
