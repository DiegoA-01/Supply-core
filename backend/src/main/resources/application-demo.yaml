# Perfil "demo": base aparte con dos empresas de ejemplo para probar el flujo real por la API.
# Arrancar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/supply_core_demo?createDatabaseIfNotExist=true&serverTimezone=America/Bogota&useUnicode=true&characterEncoding=utf8

app:
  sesion:
    limite-por-minuto: 300           # en pruebas se inician muchas sesiones seguidas desde la misma IP
  storage:
    ruta: ./almacenamiento-demo      # archivos de la demo, aparte de los de desarrollo
  ia:
    proveedor: ninguno               # la demo usa cotizaciones por formulario
